<!DOCTYPE html>
<html>
<head>
    <title>Sum of N Numbers</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: lightyellow;
        }

        input, button {
            padding: 5px;
            margin: 5px;
            color: black;
        }

        #result {
            font-weight: bold;
            color: blue;
        }
    </style>
</head>

<body>

    <h2>Sum of N Numbers</h2>

    <input type="number" id="num" placeholder="Enter a number">
    <button onclick="sumNumbers()">Find Sum</button>

    <p id="result"></p>

    <script>
        function sumNumbers() {
            let n = parseInt(document.getElementById("num").value);

            let sum = 0;

            for (let i = 1; i <= n; i++) {
                sum += i;
            }

            document.getElementById("result").innerHTML =
                "Sum = " + sum;
        }
    </script>

</body>
</html>
